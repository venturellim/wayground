


name: Build Wayground Click

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker info

      - name: Install Clickable
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx click
          pipx ensurepath
          pipx install clickable-ut
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build ARM64 Click package
        run: |
          clickable build --arch all --container-mode

      - name: Upload Click package
        uses: actions/upload-artifact@v4
        with:
          name: wayground-click
          path: build/**/*.click
          if-no-files-found: error
