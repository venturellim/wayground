



name: Build Wayground Click

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx click

      - name: Install Clickable
        run: |
          pipx ensurepath
          pipx install clickable-ut
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Click package
        run: |
          clickable build --arch all --container-mode

      - name: Upload Click package
        uses: actions/upload-artifact@v4
        with:
          name: wayground-click
          path: build/**/*.click
          if-no-files-found: error
